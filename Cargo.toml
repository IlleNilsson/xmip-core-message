# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-message"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-message"
description = "Immutable Xmip Message model."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# Only the treatment types are serialised. An artifact declares priority,
# execution profile and durability in configuration, so those have to survive a
# round trip through TOML. Sections hold Streams and never leave the process.
serde = { version = "1", features = ["derive"] }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
# The estate's encoding primitives: the varint a protobuf tag and length are written in.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

